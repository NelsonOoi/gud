[project]
name = "gud"
version = "1.0.0"
description = "Source control where the email chain is the repo"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=1.0",
  "pytest>=8",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2.168"]

[project.scripts]
gud = "gud.cli:main"

[tool.setuptools.packages.find]
include = ["gud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running benchmarks, deselected by default (run with -m slow)"]
addopts = "-m 'not slow'"
