<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gud</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <strong>gud</strong>
          <span class="quiet">No clone. This view is the mailbox.</span>
        </div>
        <div id="tip" class="tip quiet">Loading the chain…</div>
        <div id="tasks" class="tasks"></div>
      </header>
      <div id="needs"></div>
      <main id="feed" class="feed"></main>
      <section id="detail"></section>
      <form id="file-form" class="bar">
        <input name="path" placeholder="Read a file, e.g. app.py" autocomplete="off" />
        <button type="submit">Read</button>
      </form>
      <form id="task-form" class="bar">
        <input name="title" placeholder="New task" autocomplete="off" />
        <input name="description" placeholder="Description" autocomplete="off" />
        <input id="token" name="token" placeholder="Private key" autocomplete="off" />
        <button type="submit">Open</button>
      </form>
      <p id="note" class="note"></p>
    </div>
  </body>
</html>
